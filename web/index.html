<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画境 · Magpie 生图</title>
  <link rel="stylesheet" href="/src/index/studio.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23425a46'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fffdf8' font-family='serif'%3E境%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">Magpie × GPT Image</p>
        <h1>画境</h1>
      </div>
      <div class="header-tools">
        <a class="workspace-link" href="/batch">资产批量工作台 →</a>
        <div class="user-avatar" id="user-avatar" tabindex="0" role="button" aria-haspopup="menu" aria-label="账户菜单">
          <span class="avatar-letter" id="avatar-letter" aria-hidden="true">境</span>
          <div class="avatar-menu" id="avatar-menu" role="menu">
            <span class="avatar-name" id="header-user"></span>
            <button class="logout-button" id="logout-button" type="button" role="menuitem">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <form id="generate-form">
        <label for="prompt">
          <span>描述你想看见的画面</span>
          <span class="counter"><span id="count">0</span> / 4000</span>
        </label>

        <textarea
          id="prompt"
          name="prompt"
          maxlength="4000"
          placeholder="例如：雨后的江南小巷，一位撑油纸伞的女子走在青石板上，电影感侧逆光，细腻胶片质感……"
          required
        ></textarea>

        <p class="hint">Ctrl + Enter 快速生成。图片通常需要约 10–60 秒，请保持页面打开。</p>

        <fieldset class="controls" id="image-options">
          <legend class="sr-only">图片画面比例</legend>

          <div class="control">
            <div class="control-head">
              <span>画面比例</span>
              <span class="control-note" id="ratio-note">1 : 1</span>
            </div>
            <div class="select-wrap">
              <select class="select-control" id="ratio-select" name="ratio" aria-label="画面比例">
                <option value="1:1" selected>1 : 1 方形</option>
                <option value="4:3">4 : 3 横向</option>
                <option value="3:4">3 : 4 纵向</option>
                <option value="16:9">16 : 9 宽银幕</option>
                <option value="9:16">9 : 16 竖屏</option>
              </select>
              <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </div>
          </div>

        </fieldset>

        <p class="output-spec">
          最终输出 <strong id="output-dimensions">1024 × 1024</strong>
          · 上游原生尺寸，比例由画面描述锁定
        </p>

        <div class="actions">
          <button id="submit-button" type="submit">生成图像</button>
          <p class="status" id="status" role="status" aria-live="polite">等待你的想象</p>
        </div>

        <div class="progress-wrap" id="progress-wrap" aria-hidden="true">
          <div class="progress-meta">
            <span id="progress-label">正在构图</span>
            <span id="elapsed">00:00</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="图片生成进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progress-track"
          >
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
      </form>

      <section class="preview" id="preview" aria-label="生成结果">
        <div class="placeholder">
          <div class="placeholder-icon" aria-hidden="true">□</div>
          <p>生成的画面<br>将在这里浮现</p>
        </div>
        <div class="image-toolbar preview-tools" aria-label="图片操作">
          <button
            class="glass-button"
            id="download-button"
            type="button"
            title="下载原图"
            aria-label="下载原图"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path>
              <path d="M5 20h14"></path>
            </svg>
            <span>下载</span>
          </button>
          <button
            class="glass-button"
            id="maximize-button"
            type="button"
            title="最大化图片"
            aria-label="最大化图片"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.5 3.5h-5v5"></path>
              <path d="M15.5 3.5h5v5"></path>
              <path d="M20.5 15.5v5h-5"></path>
              <path d="M3.5 15.5v5h5"></path>
            </svg>
            <span>最大化</span>
          </button>
        </div>
        <img id="result-image" alt="根据提示词生成的图片">
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="最大化图片预览">
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-image" alt="最大化后的生成图片">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭大图">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12"></path>
          <path d="M18 6 6 18"></path>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="/src/index/studio.js"></script>
</body>
</html>
